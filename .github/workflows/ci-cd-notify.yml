name: CI/CD Pipeline with Email Notification

on:
  push:
    branches: ['**']       # kisi bhi branch me push ho, trigger hoga
  workflow_dispatch:        # manual trigger ka option bhi rahega

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- yahan tumhara actual AWS deploy / build steps aayenge ----
      - name: Build
        run: echo "Build steps here"

      - name: Deploy to AWS
        run: echo "Deploy steps here"
      # -----------------------------------------------------------------

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Pipeline SUCCESS - ${{ github.repository }} (${{ github.ref_name }})"
          to: kartik@xammer.com,eitish@xammer.com,shivam@xammer.com,aditya@xammer.com,akshay@xammer.com
          from: CI Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            Pipeline Status: SUCCESS ✅

            Repository     : ${{ github.repository }}
            Branch         : ${{ github.ref_name }}
            Triggered By   : ${{ github.actor }}
            Event Type     : ${{ github.event_name }}
            Commit         : ${{ github.sha }}
            Commit Message : ${{ github.event.head_commit.message }}
            Time           : ${{ github.event.head_commit.timestamp }}
            Workflow Run   : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Pipeline FAILED - ${{ github.repository }} (${{ github.ref_name }})"
          to: teammate1@example.com,teammate2@example.com
          from: CI Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            Pipeline Status: FAILED ❌

            Repository     : ${{ github.repository }}
            Branch         : ${{ github.ref_name }}
            Triggered By   : ${{ github.actor }}
            Event Type     : ${{ github.event_name }}
            Commit         : ${{ github.sha }}
            Commit Message : ${{ github.event.head_commit.message }}
            Time           : ${{ github.event.head_commit.timestamp }}
            Workflow Run   : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
